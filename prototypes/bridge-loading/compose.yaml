# THROWAWAY PROTOTYPE for issue #2.
# The komga service is a normal stock Komga service. The only additions are the bridge volume and
# JAVA_TOOL_OPTIONS (marked "added" below).
name: bridge-loading-prototype

services:
  # Stands in for the Plugin Host's start-up step: puts the Bridge into the shared volume. It also
  # seeds the fixture library.
  bridge-installer:
    build:
      context: .
      args:
        KOMGA_IMAGE: ${KOMGA_IMAGE:-gotson/komga:1.30.1}
    volumes:
      - bridge:/plugin-bridge
      - library:/library

  komga:
    image: ${KOMGA_IMAGE:-gotson/komga:1.30.1}
    depends_on:
      bridge-installer:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-25699}:25600"
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/plugin-bridge/bridge.jar # added
    volumes:
      - library:/data:ro
      - bridge:/plugin-bridge:ro # added

volumes:
  bridge:
  library:
