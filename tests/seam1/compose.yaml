# Seam 1: the whole system. Stock Komga plus the Plugin Host, a fixture library, and the reference
# plugin dropped into the plugins folder. Driven by the `tests` service through Komga's address.
# Run it with tests/seam1/run.sh.
#
# The komga service is a normal stock Komga service; the two lines marked "added" are all the
# plugin system asks of it.
# The project name is set per checkout by run.sh (-p), so parallel worktrees do not collide.
name: komga-plugin-bridge-seam1

services:
  # Stands in for the admin dropping a plugin folder into the plugins volume.
  plugin-dropper:
    build:
      context: ../..
      dockerfile: tests/seam1/plugin-dropper.Dockerfile
    labels: &labels
      komga-plugin-bridge: test
    volumes:
      - plugins:/plugins

  plugin-host:
    build:
      context: ../..
      dockerfile: plugin-host/Dockerfile
      args:
        # The Bridge is compiled against the same Komga image the tests run.
        KOMGA_IMAGE: gotson/komga:${KOMGA_VERSION:?set KOMGA_VERSION, or start through run.sh}
    labels: *labels
    depends_on:
      plugin-dropper:
        condition: service_completed_successfully
    environment:
      PLUGIN_HOST_LIBRARY_ROOTS: /data,/enablement
      # Plugins read library folders only as Komga lists them. The key does not exist until the
      # tests have claimed Komga; they then write it to this file (support/komga.ts).
      KOMGA_URL: http://komga:25600
      KOMGA_API_KEY_FILE: /state/komga-api-key
      # The Bridge reaches the host through host-proxy, which can stage an outage.
      PLUGIN_HOST_URL: http://host-proxy:8080
      # Short limits keep the resilience tests quick; the slow plugin must not be auto-disabled.
      PLUGIN_HOST_CALL_TIMEOUT_MS: "2000"
      PLUGIN_HOST_BRIDGE_TIMEOUT_MS: "3000"
      PLUGIN_HOST_FAILURE_THRESHOLD: "1000"
    volumes:
      - bridge:/plugin-bridge
      - state:/state
      - plugins:/plugins:ro
      - library:/data:ro
      - enablement:/enablement:ro
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:8080/healthz').then(r => Deno.exit(r.ok ? 0 : 1))"]
      interval: 2s
      retries: 30

  # Sits between Komga's Bridge and the Plugin Host; the tests switch it to refuse or stall.
  host-proxy:
    build:
      context: ../..
      dockerfile: tests/seam1/Dockerfile
    labels: *labels
    command: ["deno", "run", "--allow-net", "--allow-env", "tests/seam1/support/outage-proxy.ts"]
    depends_on:
      plugin-host:
        condition: service_healthy

  komga:
    image: gotson/komga:${KOMGA_VERSION:?set KOMGA_VERSION, or start through run.sh}
    labels: *labels
    depends_on:
      host-proxy:
        condition: service_started
    environment:
      # SEAM1_JAVA_OPTIONS is empty except when run.sh tests a Komga version that is not on the
      # supported list yet; it then lists that version, so the check runs with the Bridge active.
      JAVA_TOOL_OPTIONS: -javaagent:/plugin-bridge/bridge.jar ${SEAM1_JAVA_OPTIONS:-} # added
    volumes:
      - library:/data:ro
      - enablement:/enablement:ro
      - bridge:/plugin-bridge:ro # added

  # Stock Komga whose Bridge supported list is replaced by one this Komga is not on (test only).
  komga-unsupported:
    image: gotson/komga:${KOMGA_VERSION:?set KOMGA_VERSION, or start through run.sh}
    labels: *labels
    depends_on:
      plugin-host:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/plugin-bridge/bridge.jar -Dplugin-bridge.supported-versions=9.9.9
    volumes:
      - library:/data:ro
      - enablement:/enablement:ro
      - bridge:/plugin-bridge:ro

  tests:
    build:
      context: ../..
      dockerfile: tests/seam1/Dockerfile
    labels: *labels
    user: "0"
    depends_on:
      - komga
      - komga-unsupported
    environment:
      EXPECTED_KOMGA_VERSION: ${KOMGA_VERSION:?}
      KOMGA_URL: http://komga:25600
      KOMGA_UNSUPPORTED_URL: http://komga-unsupported:25600
      HOST_PROXY_URL: http://host-proxy:8081
      BRIDGE_CONFIG: /plugin-bridge/bridge.json
    volumes:
      - library:/data
      - enablement:/enablement
      - bridge:/plugin-bridge:ro # to read the shared secret, standing in for the Plugin Host
      - state:/state # to hand the Plugin Host an API key once Komga is claimed

volumes:
  bridge:
  state:
  plugins:
  library:
  enablement:
