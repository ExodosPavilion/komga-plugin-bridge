# Seam 1: the whole system. Stock Komga plus the Plugin Host, a fixture library, and the reference
# plugin dropped into the plugins folder. Driven by the `tests` service through Komga's address.
# Run it with tests/seam1/run.sh.
#
# The komga service is a normal stock Komga service; the two lines marked "added" are all the
# plugin system asks of it.
# The project name is set per checkout by run.sh (-p), so parallel worktrees do not collide.
name: komga-plugin-bridge-seam1

services:
  # Stands in for the admin dropping a plugin folder into the plugins volume.
  plugin-dropper:
    build:
      context: ../..
      dockerfile: tests/seam1/plugin-dropper.Dockerfile
    labels: &labels
      komga-plugin-bridge: test
    volumes:
      - plugins:/plugins

  plugin-host:
    build:
      context: ../..
      dockerfile: plugin-host/Dockerfile
    labels: *labels
    depends_on:
      plugin-dropper:
        condition: service_completed_successfully
    environment:
      PLUGIN_HOST_LIBRARY_ROOTS: /data
      # The Bridge reaches the host through host-proxy, which can stage an outage.
      PLUGIN_HOST_URL: http://host-proxy:8080
      # Short limits keep the resilience tests quick; the slow plugin must not be auto-disabled.
      PLUGIN_HOST_CALL_TIMEOUT_MS: "2000"
      PLUGIN_HOST_BRIDGE_TIMEOUT_MS: "3000"
      PLUGIN_HOST_FAILURE_THRESHOLD: "1000"
    volumes:
      - bridge:/plugin-bridge
      - state:/state
      - plugins:/plugins:ro
      - library:/data:ro
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:8080/healthz').then(r => Deno.exit(r.ok ? 0 : 1))"]
      interval: 2s
      retries: 30

  # Sits between Komga's Bridge and the Plugin Host; the tests switch it to refuse or stall.
  host-proxy:
    build:
      context: ../..
      dockerfile: tests/seam1/Dockerfile
    labels: *labels
    command: ["deno", "run", "--allow-net", "--allow-env", "tests/seam1/support/outage-proxy.ts"]
    depends_on:
      plugin-host:
        condition: service_healthy

  komga:
    image: gotson/komga:1.30.1
    labels: *labels
    depends_on:
      host-proxy:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/plugin-bridge/bridge.jar # added
    volumes:
      - library:/data:ro
      - bridge:/plugin-bridge:ro # added

  tests:
    build:
      context: ../..
      dockerfile: tests/seam1/Dockerfile
    labels: *labels
    user: "0"
    depends_on:
      - komga
    environment:
      KOMGA_URL: http://komga:25600
      HOST_PROXY_URL: http://host-proxy:8081
    volumes:
      - library:/data

volumes:
  bridge:
  state:
  plugins:
  library:
